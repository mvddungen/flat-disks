[project]
name = "flatdisks"
version = "0.1.0"
description = "Code accompanying the MSc thesis 'JT Gravity and the Continuum Limit of Random Flat Disks'"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flatdisks"]
